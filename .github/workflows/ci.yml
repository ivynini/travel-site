name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支连续提交时，取消上一次还在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Type / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规范（ESLint）
        run: npm run lint

      - name: 类型检查（vue-tsc）
        run: npm run type-check

      - name: 单元测试（Vitest）
        run: npm run test:run

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3